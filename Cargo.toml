[package]
name = "icon"
description = "Reality-compliant library to find icons on linux with ease"
version = "0.1.3"
edition = "2024"
license = "MIT OR Apache-2.0"
include = [
    "/Cargo.toml",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
    "/README.md",
    "/src/**"
]
repository = "https://github.com/zeroeightysix/icon"
readme = "README.md"
keywords = ["icon", "loader", "theme", "xdg"]
categories = ["multimedia::images", "data-structures"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
freedesktop_entry_parser = { version = "2.0.1", default-features = false }
thiserror = "2.0.21"
xdg = "3.0.0"
log = { version = "0.4.34", optional = true }
smol_str = { version = "0.3.7", optional = true }
ahash = "0.8.12"

[features]
"log" = ["dep:log"]
"cache" = ["dep:smol_str"]

[dev-dependencies]
freedesktop-desktop-entry = "0.8.4"
criterion = "0.8.2"
icon = { path = ".", features = ["cache"] } # Used by ./benches

[lib]
# Lib does not contain a criterion harness -> would error when [criterion options] are passed to `cargo bench`. E.g. `cargo bench -- --save-baseline before`
bench = false

[[bench]]
name = "hicolor_icons"
harness = false # criterion manages the harness

[[bench]]
name = "all_themes"
harness = false
